<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Asset Extractor</title>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="app-container">
    <header>
      <h1>Product Asset Extractor</h1>
      <p>
        Automatically detects product images, documents, image roles,
        and resolutions. CSV output only.
      </p>
    </header>

    <section class="card">
      <label class="file-label">
        Upload Product Catalog (CSV or Excel)
        <input type="file" id="fileInput" accept=".csv,.xlsx" />
      </label>

      <div id="productIdSection" class="hidden">
        <label>
          Product Identifier Column
          <select id="productIdColumn"></select>
        </label>

        <button id="processBtn">Process & Download CSV</button>
      </div>
    </section>

    <section class="status">
      <span id="statusText"></span>
    </section>
  </div>

  <!-- App Scripts -->
  <script src="js/fileLoader.js"></script>
  <script src="js/processor.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
