<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Asset Extractor</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="container">
    <h1>Product Asset Extractor</h1>
    <p class="subtitle">
      Automatically detects images, documents, image roles, and resolutions.
      No column mapping except Product Identifier.
    </p>

    <div class="card">
      <label class="upload">
        Upload Product Catalog (CSV or Excel)
        <input type="file" id="fileInput" accept=".csv,.xlsx" />
      </label>

      <div id="productIdBlock" class="hidden">
        <label>
          Product Identifier Column
          <select id="productIdColumn"></select>
        </label>

        <button id="processBtn">Process & Download CSV</button>
      </div>
    </div>

    <div class="status" id="statusText"></div>
  </div>

  <script src="js/fileLoader.js"></script>
  <script src="js/processor.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
